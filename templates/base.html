<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PT REC Indonesia Group{% endblock %}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- BACKGROUND GLOBAL -->
<div class="global-bg">
    <div class="hero-overlay"></div>
</div>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
        <h1 class="hero-title brand-header">
            <img src="{{ url_for('static', filename='img/icons/logo_rec.png') }}"
                 alt="REC Indonesia Group"
                 class="brand-logo">
            <span>REC INDONESIA GROUP</span>
        </h1>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navMenu">
            <ul class="navbar-nav gap-3">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">Tentang</a></li>
                <!--li class="nav-item"><a class="nav-link" href="/services">Pelayanan</a></li-->
                <li class="nav-item"><a class="nav-link" href="/licenses">Lisensi</a></li>
                <li class="nav-item"><a class="nav-link" href="/contact">Hubungi</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<main class="page-wrapper animate-slide">
    {% block content %}{% endblock %}
</main>

<!-- Bootstrap 5 JS (WAJIB bundle) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
